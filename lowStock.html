<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    
    <main class="layout">

            <section class="sidebar">
                <div class="brand">
                    <img src="./assets/logo.png" class="h-14">
                    <h1 class="text-white">invento<span class="text-orange-300">.</span></h1>
                </div>

            
                <nav >
                    <div class="sidelist">
                        <h3 class="tracking-widest text-[10px] text-[rgb(208,218,215)] ms-5">WORKSPACE</h3>
                        <button>
                            <i class="fa-solid fa-table-cells-large"></i>
                        <a href="./dashboard.html">Dashboard</a>  
                        </button>

                        <button>
                            <i class="fa-solid fa-box"></i>
                            <a href="product.html">Products</a> 
                        </button>

                        <button>
                            <i class="fa-solid fa-plus"></i>
                            <a href="add.html">Add Product</a> 
                        </button>

                        <button>
                            <i class="fa-solid fa-triangle-exclamation"></i>
                            <a href="lowStock.html">Low Stock</a> 
                        </button>

                        <button>
                            <i class="fa-solid fa-gear"></i>
                            <a href="settings.html">Settings</a>
                        </button>
                    </div>
                </nav>
            <div class="helpBox">
                <h4>Need a hand?</h4>
                <p>Your insight, sorted. Take a breath.</p>
            </div>

                <button class="logout" id="logout"> <i class="fa-solid fa-right-from-bracket"></i> Log Out</button>

            </section>

            <section class="low">

                <div class="flex justify-between items-center p-5 pb-2">
                    <div class="ps-10 leading-5">
                    <h4 class="font-semibold text-gray-400 text-sm">KEEP STOCK IN CHECK</h4>
                    <h3 class="font-bold text-[rgb(35,81,64)] text-3xl tracking-widest">Low Stock</h3>
                    <p class="ps-1 text-[rgb(95,108,104)]">Identify low-stock products and plan your restocking</p>
                    </div>

                    <div class="flex justify-end gap-10 items-center p-5">
                        <div class="relative">

                            <i class="fa-solid fa-bell text-xl text-[rgb(197,150,69)]" id="notifications"></i>
                                <div id="notificationBox" class="hidden">
                                    <h3> Notifications</h3>
                                    <div id="notificationList">No notifications yet.</div>
                                </div>

                        </div>
                        <!-- PROFILE ICON -->
            <div class="relative">
                    <button id="profileBtn" class="cursor-pointer">
                        <i class="fa-solid fa-user text-xl text-[rgb(35,81,64)]"></i>
                    </button>

                    <div id="profileDropdown" class="hidden absolute right-0 top-full mt-3 w-64 bg-[rgb(252,252,244)] rounded-xl shadow-xl border border-gray-200 z-50 overflow-hidden">

    <!-- Profile Details -->
                        <div class="p-4 bg-[rgb(35,81,64)]">
                            <div class="flex items-center gap-3">
                                <div class="w-11 h-11 rounded-full bg-[rgb(197,150,69)] flex items-center justify-center text-white text-lg">
                                    <i class="fa-solid fa-user"></i>
                                </div>

                                <div class="min-w-0">
                                    <p id="profileName" class="font-semibold text-white truncate">
                                        User Name
                                    </p>
                                    <p id="profileEmail" class="text-xs text-gray-200 break-all">
                                        user@email.com
                                    </p>
                                </div>
                            </div>
                        </div>

            <!-- Settings -->
                        <a href="settings.html"
                        class="flex items-center gap-3 px-4 py-3 text-[rgb(35,81,64)] hover:bg-[rgb(238,238,231)] transition">
                            <i class="fa-solid fa-gear w-5 text-center"></i>
                            <span class="text-sm font-medium">Settings</span>
                            <i class="fa-solid fa-chevron-right ml-auto text-xs text-gray-400"></i>
                        </a>

                         <div class="mx-4 border-t border-gray-200"></div>

            <!-- Logout -->
                        <button id="profileLogout"
                                class="flex items-center gap-3 w-full px-4 py-3 text-red-600 hover:bg-red-50 transition">
                            <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                            <span class="text-sm font-medium">Logout</span>
                        </button>
        </div>
                    </div>

            </div>

        </div>
            </div>
            
        </div>    
                       <!-- ----------------------------------- -->
                    </div>
            
                </div>   
            
            <div class="lowBox ">
                <div>
                    <div class="flex justify-between items-center">
                        <h5 class="text-[rgb(95,108,104)] text-[16px] font-semibold ">Low Stock Products</h5>
                        <i class="fa-solid fa-arrow-down-wide-short bg-[rgb(255,237,213)] text-[rgb(253,186,116)]"></i>
                    </div>
                    <p id="lowStockNumber_low"></p>
                </div>

                <div>
                    <div class="flex justify-between items-center">
                        <h5 class="text-[rgb(95,108,104)] text-[16px] font-semibold ">Critical Products</h5>
                        <i class="fa-solid fa-triangle-exclamation bg-[rgb(243,225,213)] text-[rgb(138,69,39)]"></i>
                    </div>
                    <p id="criticalPdtsNumber_low"></p>
                </div>

                <div>
                    <div class=" flex items-center justify-between">
                        <h5 class="text-[rgb(95,108,104)] text-[16px] font-semibold ">Zero Stock</h5>
                        <i class="fa-solid fa-dolly text-[rgb(233,91,91)] bg-[rgb(242,191,191)]"></i>
                     </div>
                    <p id="outStockNumber_low"></p>
                </div>

            </div>
             
    <div class="flex items-center gap-15 p-5 my-5 mx-15 bg-white rounded-lg">

        <input type="text" placeholder="Search products..." id="search" class="w-100 p-2 bg-[rgb(250,249,245)] rounded-lg text-[rgb(35,81,64)]">
    
        <div class="flex items-center gap-15 text-[rgb(35,81,64)]">
            <select name="categories" id="cats" class="bg-[rgb(238,238,231)] p-2 w-40 rounded-lg">
                <option value="all">All Categories</option>
                <option value="smartphones">Smartphones</option>
                <option value="laptops">Laptops</option>
                <option value="tablets">Tablets</option>
                <option value="mobile-accessories">Accessories</option>
                
            </select>
    

            <select name="status" id="stocks" class="bg-[#F6FAF6] p-2 w-40 rounded-lg">
                <option value="">Stock Status</option>
                <option value="critical">Critical ( 1 - 5 )</option>
                <option value="low">Low Stock</option>
                <option value="outOfStock">Zero Stock</option>
            </select>

            
            <select name="sort" id="sort" class="bg-[#F6FAF6] p-2 w-40 rounded-lg">
                <option value="">Sort By</option>
                <option value="lowToHigh">Low to High</option>
                <option value="highToLow">High to Low</option>
                <option value="needed">Most Needed</option>
            </select>

        </div>
    </div>
   
                     
                
        
    <div class="lowTableContainer">
        <section class="lowPdts"></section>

            <div class=" pagination flex justify-center items-center gap-8 my-5">
                <button id="prev">
                    < Previous
                </button>

                <span id="pgNo" class="font-semibold text-[rgb(35,81,64)]">
                    1 
                </span>

                <button id="next">
                
                    Next >
                </button>
            </div>
    </div>

    </section>
    </main>
   

    <script src="lowStock.js"></script>
    
</body>
</html>
