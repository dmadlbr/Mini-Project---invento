<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="product.css">
  
    
</head>
<body>
    <main class="layout">

    <section class="sidebar" id="sidebar">
        <div class="brand">
            <a href="land.html"><img src="./assets/logo.png" class="h-14"></a>
            <h1 class="text-white">invento<span class="text-orange-300">.</span></h1>
        </div>

    
        <nav >
            <div class="sidelist">
                <h3 class="tracking-widest text-[10px] text-[rgb(208,218,215)] ms-5">WORKSPACE</h3>
                <button>
                    <i class="fa-solid fa-table-cells-large"></i>
                   <a href="./dashboard.html">Dashboard</a>  
                </button>

                <button>
                    <i class="fa-solid fa-box"></i>
                    <a href="product.html">Products</a> 
                </button>

                <button>
                    <i class="fa-solid fa-plus"></i>
                    <a href="add.html">Add Product</a> 
                </button>

                <button>
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <a href="lowStock.html">Low Stock</a>
                 
                </button>

                <button>
                    <i class="fa-solid fa-gear"></i>
                    <a href="settings.html">Settings</a>
                </button>
            </div>
        </nav>
    <div class="helpBox">
        <h4>Need a hand?</h4>
        <p>Your insight, sorted. Take a breath.</p>
    </div>

         <button class="logout" id="logout"> <i class="fa-solid fa-right-from-bracket"></i> Log Out</button>

    </section>
    <div id="sidebarOverlay"></div>
    <section class="pdt">

    <!-- HEADER -->
    <div class="flex justify-between items-center gap-3 p-4 sm:p-5 pb-2">

        <!-- HAMBURGER + HEADING -->
        <div class="flex items-center gap-3 min-w-0">

            <button id="menuBtn" type="button"
                class="menuBtn text-2xl text-[rgb(35,81,64)] shrink-0">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="ps-0 sm:ps-10 leading-5 min-w-0">
                <h4 class="font-semibold text-gray-400 text-sm">
                    INVENTORY OPERATIONS
                </h4>

                <h3 class="font-bold text-[rgb(35,81,64)] text-2xl sm:text-3xl tracking-widest">
                    Products
                </h3>

                <p class="ps-1 text-[rgb(95,108,104)]">
                    Manage your store catalog, pricing and stock status
                </p>
            </div>

        </div>

        <!-- NOTIFICATION + PROFILE -->
        <div class="flex gap-6 sm:gap-10 items-center p-2 sm:p-5">

            <!-- Notification -->
            <div class="relative">
                <button id="notifications" class="relative cursor-pointer">
                    <i class="fa-solid fa-bell text-xl text-[rgb(197,150,69)]"></i>

                    <span id="unreadCount"
                        class="absolute -top-2 -right-2 bg-[rgb(197,150,69)] text-white text-xs rounded-full min-w-4 h-4 flex items-center justify-center">
                        0
                    </span>
                </button>

                <div id="notificationBox"
                    class="hidden absolute right-0 top-full mt-4 w-[min(20rem,calc(100vw-2rem))] bg-white rounded-xl shadow-xl border border-gray-200 z-50 p-4">

                    <div class="flex justify-between items-center gap-2">
                        <h3 class="text-lg font-bold text-[rgb(35,81,64)]">
                            Recent Notifications
                        </h3>

                        <button id="markAllRead"
                            class="text-xs text-[rgb(35,81,64)] hover:underline">
                            Mark all as read
                        </button>
                    </div>

                    <p id="notificationSummary" class="text-xs text-gray-500 mt-2 mb-3">
                        No unread notifications
                    </p>

                    <div id="notificationList">
                        No notifications yet.
                    </div>
                </div>
            </div>

        <!-- Profile -->
            <div class="relative">
                <button id="profileBtn" class="cursor-pointer">
                    <i class="fa-solid fa-user text-xl text-[rgb(35,81,64)]"></i>
                </button>

                <div id="profileDropdown"
                    class="hidden absolute right-0 top-full mt-3 w-[min(16rem,calc(100vw-2rem))] bg-[rgb(252,252,244)] rounded-xl shadow-xl border border-gray-200 z-50 overflow-hidden">

                    <div class="p-4 bg-[rgb(35,81,64)]">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-full bg-[rgb(197,150,69)] flex items-center justify-center text-white text-lg">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <div class="min-w-0">
                                <p id="profileName" class="font-semibold text-white truncate">
                                    User Name
                                </p>

                                <p id="profileEmail" class="text-xs text-gray-200 break-all">
                                    user@email.com
                                </p>
                            </div>
                        </div>
                    </div>

                    <a href="settings.html"
                        class="flex items-center gap-3 px-4 py-3 text-[rgb(35,81,64)] hover:bg-[rgb(238,238,231)] transition">
                        <i class="fa-solid fa-gear w-5 text-center"></i>
                        <span class="text-sm font-medium">Settings</span>
                        <i class="fa-solid fa-chevron-right ml-auto text-xs text-gray-400"></i>
                    </a>

                    <div class="mx-4 border-t border-gray-200"></div>

                    <button id="profileLogout"
                        class="flex items-center gap-3 w-full px-4 py-3 text-red-600 hover:bg-red-50 transition">
                        <i class="fa-solid fa-right-from-bracket w-5 text-center"></i>
                        <span class="text-sm font-medium">Logout</span>
                    </button>
                </div>
        </div>

    </div>
</div>
<!-- END HEADER -->
    
   
     <!-- ----------------------------------------------- -->
    <div class="flex items-center gap-5 p-5 my-5 mx-15 bg-white rounded-lg">

        <input type="text" placeholder=" Search products..." id="search" class="flex-1 min-w-0 p-2 bg-[rgb(250,249,245)] rounded-lg">
    
    <div class="flex items-center gap-5">
          <select name="categories" id="cats" class="bg-[rgb(238,238,231)] p-2 w-40 rounded-lg">
            <option value="all">All Categories</option>
            <option value="smartphones">Smartphones</option>
            <option value="laptops">Laptops</option>
            <option value="tablets">Tablets</option>
            <option value="mobile-accessories">Accessories</option>
            
          </select>
    

        <select name="status" id="stocks" class="bg-[#F6FAF6] p-2 w-40 rounded-lg">
         <option value="">Stock Status</option>
         <option value="stock">In Stock</option>
         <option value="low">Low Stock</option>
         <option value="outOfStock">Out of Stock</option>
        </select>

        <a href="add.html"
        class="bg-[rgb(35,81,64)] w-48 p-3 text-white rounded-2xl hover:-translate-y-1 transition duration-300 text-center">
        <i class="fa-solid fa-plus"></i> Add New Product
        </a>
        
    </div>
    </div>

    <section class="allPdts"></section>
    <div class="pagination">
    <button type="button" id="prev"> < Previous</button>
    <span id="pgNo">1</span>
    <button type="button" id="next">Next > </button>
    </div>
    </section>
    

        </main>

    <script src="product.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
